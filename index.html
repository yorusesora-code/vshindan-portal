<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTuber診断ポータル｜配信者・活動者のための診断あそび場</title>
<meta name="description" content="VTuber・配信者・活動者向けの診断を集めたポータルサイト。診断して、結果をXでシェアして遊ぼう。">
<meta property="og:title" content="VTuber診断ポータル">
<meta property="og:description" content="配信者・VTuber・活動者のための診断あそび場。診断して結果をXでシェアしよう。">
<meta property="og:type" content="website">
<meta property="og:image" content="/ogp/site.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2FF; --card:#FFFFFF; --ink:#2A2740; --ink-soft:#6B6685; --ink-faint:#A19CBF;
  --violet:#7F77DD; --violet-deep:#3C3489; --violet-pale:#EEEDFE; --line:#E4E0F5;
  --pink:#F4A0C6; --mint:#9FE0C8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c',-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1rem 3rem}
header{text-align:center;margin-bottom:2rem}
.site-badge{display:inline-block;background:var(--violet-pale);color:var(--violet-deep);border-radius:999px;padding:6px 18px;font-size:12px;font-weight:700;margin-bottom:.9rem;letter-spacing:.05em}
h1{font-size:clamp(26px,6vw,36px);font-weight:900;color:var(--violet-deep);line-height:1.35;margin-bottom:.6rem}
.tagline{font-size:14px;color:var(--ink-soft);line-height:1.8}
.deco{display:flex;justify-content:center;gap:8px;margin-top:1rem;font-size:20px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.quiz-card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.25rem;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(127,119,221,.07);transition:transform .15s,box-shadow .15s}
.quiz-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(127,119,221,.16)}
.qc-emoji{font-size:38px;margin-bottom:.6rem}
.qc-title{font-size:17px;font-weight:900;color:var(--violet-deep);line-height:1.5;margin-bottom:.5rem}
.qc-desc{font-size:13px;color:var(--ink-soft);line-height:1.7;flex:1;margin-bottom:.9rem}
.qc-meta{display:flex;gap:8px;margin-bottom:.9rem}
.qc-meta span{background:var(--bg);color:var(--ink-soft);font-size:11px;font-weight:700;border-radius:999px;padding:4px 12px}
.qc-cta{align-self:flex-start;background:var(--violet);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:8px 20px}
.coming{border-style:dashed;opacity:.75}
.coming .qc-cta{background:var(--line);color:var(--ink-soft)}
footer{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:3rem;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="site-badge">VTuber・配信者・活動者むけ</div>
    <h1>VTuber診断ポータル</h1>
    <p class="tagline">サクッと診断して、結果をXでシェアして遊ぼう。<br>診断は続々追加予定！</p>
    <div class="deco">🎙️ 🎮 🎵 ✨</div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    診断結果はエンタメです。ゆるく楽しんでね。<br>
    © <span id="yr"></span> VTuber診断ポータル
  </footer>
</div>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
fetch('data/list.json').then(r=>r.json()).then(data=>{
  const grid=document.getElementById('grid');
  data.quizzes.forEach(q=>{
    const a=document.createElement('a');
    a.className='quiz-card';
    a.href=`quiz.html?id=${encodeURIComponent(q.id)}`;
    a.innerHTML=`
      <div class="qc-emoji">${q.emoji||'✨'}</div>
      <div class="qc-title">${q.title}</div>
      <div class="qc-desc">${q.description}</div>
      <div class="qc-meta"><span>全${q.questionsCount}問</span><span>約${q.minutes}分</span></div>
      <div class="qc-cta">診断する →</div>`;
    grid.appendChild(a);
  });
  // 次回予告カード
  const c=document.createElement('div');
  c.className='quiz-card coming';
  c.innerHTML=`
    <div class="qc-emoji">🔜</div>
    <div class="qc-title">新しい診断、準備中…</div>
    <div class="qc-desc">次の診断を制作中です。Xでのシェアが次回作の励みになります！</div>
    <div class="qc-meta"><span>coming soon</span></div>
    <div class="qc-cta">おたのしみに</div>`;
  grid.appendChild(c);
});
</script>
</body>
</html>
